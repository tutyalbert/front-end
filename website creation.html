<!DOCTYPE html>
<html>
<head>
    <title>Instagram Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            width: 300px;
            background: white;
            border: 1px solid #ddd;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-family: cursive;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 5px 0;
        }

        button {
            width: 97%;
            padding: 10px;
            background: #0095f6;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #0077cc;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h1>Instagram</h1>
    
    <input type="text" placeholder="Phone number, username, or email">
    <input type="password" placeholder="Password">
    
    <button>Log In</button>
</div>

</body>
</html>
