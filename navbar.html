<!DOCTYPE html>
<html>
<head>
<title>Navigation Bar with Dropdown</title>
<style>
body { margin: 0; font-family: Arial; }
.navbar { background-color: #333; overflow: hidden; }
.navbar a { float: left; color: white; padding: 14px 16px; text-decoration: none; }
.dropdown { float: left; overflow: hidden; }
.dropdown .dropbtn { border: none; outline: none; color: white; padding: 14px 16px; background-color:
inherit; cursor: pointer; }
.dropdown-content { display: none; position: absolute; background-color: #f9f9f9; min-width: 160px; }
.dropdown-content a { color: black; padding: 12px 16px; display: block; }
.navbar a:hover, .dropdown:hover .dropbtn { background-color: #04AA6D; }
.dropdown:hover .dropdown-content { display: block; }
.dropdown-content a:hover { background-color: #ddd; }
</style>
</head>
<body>
<div class="navbar">
<a href="#">Home</a>
<a href="#">About</a>
<div class="dropdown">
<button class="dropbtn">Services ▼</button>
<div class="dropdown-content">
<a href="#">Web Design</a>
<a href="#">App Development</a>
</div>
</div>
<a href="#">Contact</a>
</div>
</body>
</html>
