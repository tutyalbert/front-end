<!DOCTYPE html>
<html>
<head>
<style>
body { font-family: "Times New Roman"; background: #f2f2f2; }
.container { width: 400px; background: white; margin: 50px auto; padding: 25px; border-radius: 10px;
box-shadow: 0px 0px 10px gray; }
input, select { width: 100%; padding: 8px; margin: 8px 0; }
button { width: 48%; padding: 10px; color: white; border: none; cursor: pointer; }
.submit { background: green; } .reset { background: red; }
</style>
</head>
<body>
<div class="container">
<h2 align="center">Registration Form</h2>
<form>
<label>Full Name</label><input type="text" placeholder="Enter Name" required>
<label>Email</label><input type="email" placeholder="Enter Email" required>
<label>Password</label><input type="password" placeholder="Enter Password" required>
<label>Gender</label><br>
<input type="radio" name="gender"> Male <input type="radio" name="gender"> Female<br><br>
<label>Course</label>
<select><option>BCA</option><option>B.Sc</option></select>
<button class="submit">Submit</button>
<button type="reset" class="reset">Reset</button>
</form>
</div>
</body>
</html>
