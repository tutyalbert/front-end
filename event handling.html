<!DOCTYPE html>
<html>
<head>
<title>Event Handling Example</title>
<script>
function showMessage() {
document.getElementById("message").innerHTML = "Button Click Event Triggered!";
}
function changeColor() { document.body.style.backgroundColor = "lightyellow"; }
function resetColor() { document.body.style.backgroundColor = "#f2f2f2"; }
</script>
</head>
<body style="text-align:center; background-color:#f2f2f2;">
<div style="margin-top:80px;">
<h2>JavaScript Event Handling</h2>
<button onclick="showMessage()">Click Me</button>
<button onmouseover="changeColor()" onmouseout="resetColor()">Hover Over Me</button>
<p id="message" style="color:blue; font-size:20px;"></p>
</div>
</body>
</html>
