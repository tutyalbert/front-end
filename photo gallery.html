<!DOCTYPE html>
<html>
<head>
<title>Photo Gallery using CSS Grid</title>
<style>
body { font-family: Arial; margin: 0; background-color: #f4f4f4; text-align: center; }
h1 { background-color: #2c3e50; color: white; padding: 15px; }
.gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; padding:
20px; }
.gallery img { width: 100%; height: 200px; border-radius: 10px; object-fit: cover; box-shadow: 0px 0px
8px gray; }
</style>
</head>
<body>
<h1>Responsive Photo Gallery</h1>
<div class="gallery">
<img src="img1.jpg" alt="Image 1">
<img src="img2.jpg" alt="Image 2">
<img src="img3.jpg" alt="Image 3">
</div>
</body>
</html>
