<!DOCTYPE html>
<html>
<head>
<title>Image Slider</title>
<style>
.slider { width: 500px; margin: 50px auto; }
.slider img { width: 100%; height: 300px; border-radius: 10px; }
</style>
<script>
let images = ["image1.jpg", "image2.jpg", "image3.jpg"];
let index = 0;
function showImage() { document.getElementById("slide").src = images[index]; }
function nextImage(){ index = (index + 1) % images.length; showImage(); }
function prevImage() { index = (index - 1 + images.length) % images.length; showImage(); }
setInterval(nextImage, 3000);
</script>
</head>
<body onload="showImage()" style="text-align:center;">
<h2>Image Slider / Carousel</h2>
<div class="slider"><img id="slide" src=""></div>
<button onclick="prevImage()">Previous</button>
<button onclick="nextImage()">Next</button>
</body>
</html>
